name: Fetch and Convert NOAA Pressure Data

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  schedule:
    # Run every 6 hours to align with GFS cycles (00, 06, 12, 18 UTC)
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      forecast_cycle:
        description: 'Forecast cycle (00, 06, 12, 18)'
        required: false
        default: 'latest'
      pressure_levels:
        description: 'Comma-separated pressure levels (hPa)'
        required: false
        default: '1000,925,850,700,500,300,250,200'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install xarray zarr cfgrib dask netcdf4 s3fs
          pip install numcodecs requests numpy pandas
          pip install kerchunk fsspec aiohttp

      - name: Fetch GFS GRIB2 data
        run: |
          python scripts/fetch_gfs_data.py
        env:
          FORECAST_CYCLE: ${{ github.event.inputs.forecast_cycle || 'latest' }}
          PRESSURE_LEVELS: ${{ github.event.inputs.pressure_levels || '1000,925,850,700,500,300,250,200' }}

      - name: Convert GRIB2 to Zarr
        run: |
          python scripts/convert_to_zarr.py
        env:
          MAX_MEMORY: "4GB"

      - name: Generate metadata
        run: |
          python scripts/generate_metadata.py

      - name: Verify data exists
        run: |
          if [ ! -d "data/pressure_data.zarr" ]; then
            echo "ERROR: Zarr data not created"
            exit 1
          fi
          if [ ! -f "data/metadata.json" ]; then
            echo "ERROR: Metadata not created"
            exit 1
          fi
          echo "Data verification successful"

      - name: Copy data to docs for GitHub Pages
        run: |
          # Copy Zarr data and metadata to docs directory for Pages deployment
          mkdir -p docs/data
          if [ -d "data/pressure_data.zarr" ]; then
            cp -r data/pressure_data.zarr docs/data/
          fi
          if [ -f "data/metadata.json" ]; then
            cp data/metadata.json docs/data/
          fi

          # List what we're deploying
          echo "Files in docs/data:"
          ls -lah docs/data/ || echo "No data directory yet"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "Deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
